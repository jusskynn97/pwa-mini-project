<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; }
        .icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 24px; margin: 24px 0; }
        .icon-box { text-align: center; }
        .icon-box canvas { border: 2px solid #e2e8f0; border-radius: 24px; background: #0284c7; }
        .icon-box p { margin-top: 8px; font-size: 12px; color: #64748b; }
        .download-all {
            background: #0284c7; color: white; border: none; padding: 14px 28px;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        h1 { color: #0284c7; }
        .note { background: #fef3c7; padding: 16px; border-radius: 8px; margin: 24px 0; }
    </style>
</head>
<body>
    <h1>🎨 PWA Icon Generator</h1>
    <p>Tool này tạo các icon PWA theo đúng kích thước chuẩn. Click nút bên dưới để tải tất cả về.</p>
    
    <div class="note">
        <strong>Lưu ý:</strong> Sau khi tải, giải nén và copy thư mục <code>icons/</code> vào thư mục dự án.
    </div>

    <div id="iconsContainer" class="icons-grid"></div>

    <button class="download-all" onclick="downloadAll()">⬇️ Download Tất Cả Icons</button>

    <script>
        const ICON_SIZES = [72, 96, 128, 144, 152, 192, 384, 512];
        const createdIcons = {};

        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0ea5e9');
            gradient.addColorStop(0.5, '#0284c7');
            gradient.addColorStop(1, '#0369a1');
            
            const radius = size * 0.18;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            const buildingSize = size * 0.5;
            const buildingX = (size - buildingSize) / 2;
            const buildingY = size * 0.22;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fillRect(buildingX, buildingY + buildingSize * 0.2, buildingSize, buildingSize * 0.8);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fillRect(buildingX + buildingSize * 0.35, buildingY, buildingSize * 0.3, buildingSize * 0.3);

            ctx.fillStyle = '#0284c7';
            const winSize = buildingSize * 0.15;
            const winGap = buildingSize * 0.1;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const wx = buildingX + buildingSize * 0.15 + col * (winSize + winGap);
                    const wy = buildingY + buildingSize * 0.3 + row * (winSize + winGap * 0.5);
                    ctx.fillRect(wx, wy, winSize, winSize);
                }
            }

            const flagX = buildingX + buildingSize * 0.5;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = Math.max(1, size * 0.015);
            ctx.beginPath();
            ctx.moveTo(flagX, buildingY);
            ctx.lineTo(flagX, buildingY - buildingSize * 0.15);
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(flagX, buildingY - buildingSize * 0.15);
            ctx.lineTo(flagX + buildingSize * 0.2, buildingY - buildingSize * 0.08);
            ctx.lineTo(flagX, buildingY - buildingSize * 0.01);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.14}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('VKU', size / 2, size - size * 0.08);

            ctx.font = `${size * 0.055}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fillText('INSPECTOR', size / 2, size - size * 0.03);

            return canvas;
        }

        function renderIcons() {
            const container = document.getElementById('iconsContainer');
            ICON_SIZES.forEach(size => {
                const canvas = createIcon(size);
                createdIcons[size] = canvas;
                
                const displaySize = 96;
                const scaled = document.createElement('canvas');
                scaled.width = displaySize;
                scaled.height = displaySize;
                const sctx = scaled.getContext('2d');
                sctx.drawImage(canvas, 0, 0, displaySize, displaySize);

                const box = document.createElement('div');
                box.className = 'icon-box';
                box.appendChild(scaled);
                const p = document.createElement('p');
                p.textContent = `${size}×${size}`;
                box.appendChild(p);
                container.appendChild(box);
            });
        }

        function downloadAll() {
            ICON_SIZES.forEach(size => {
                const canvas = createdIcons[size];
                canvas.toBlob(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `icon-${size}x${size}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                }, 'image/png');
            });
        }

        renderIcons();
    </script>
</body>
</html>
