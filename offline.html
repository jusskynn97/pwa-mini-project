<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0284c7">
    <title>Offline - VKU Inspector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            color: #0284c7;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            padding: 8px 16px;
            border-radius: 20px;
            margin: 24px 0;
            font-weight: 600;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn:hover { background: #0369a1; }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Mất kết nối mạng</h1>
        <p>Ứng dụng VKU Inspector đang hoạt động ở chế độ Offline.</p>
        <div class="status">
            <span class="dot"></span>
            <span>OFFLINE</span>
        </div>
        <p style="margin-top: 16px;">
            Dữ liệu kiểm tra của bạn vẫn được <strong>lưu cục bộ</strong> và sẽ 
            <strong>tự động đồng bộ</strong> khi có kết nối mạng trở lại.
        </p>
        <a href="./index.html" class="btn">Thử lại</a>
    </div>
    <script>
        window.addEventListener('online', () => window.location.href = './index.html');
    </script>
</body>
</html>
